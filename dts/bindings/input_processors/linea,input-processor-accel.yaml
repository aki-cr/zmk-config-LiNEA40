description: |
  LiNEA40 用のトラボの加速。動かす速さ（1回の報告あたりの移動量）に応じて、
  X/Y の移動量に min〜max の倍率をかける（端数は持ち越す）。

compatible: "linea,input-processor-accel"

include: ip_zero_param.yaml

properties:
  min-factor-milli:
    type: int
    default: 1000
    description: ゆっくり動かしたときの倍率（1000 = 1倍）
  max-factor-milli:
    type: int
    default: 1000
    description: 速く動かしたときの倍率（1000 = 1倍）
  speed-low:
    type: int
    default: 2
    description: この移動量以下は min-factor-milli
  speed-high:
    type: int
    default: 20
    description: この移動量以上は max-factor-milli（間はなめらかにつなぐ）
  min-interval-ms:
    type: int
    default: 0
    description: |
      0 より大きいと、移動量をためてこの間隔より短くは送らない（間の報告は 0 にする）。
      スクロールを Conductor と同じ約15ms おきの信号にして、Mac Mouse Fix の加速が効くようにするため
  settings-slot:
    type: int
    default: 0
    description: |
      1 にすると、LiNEA40 Studio から Bluetooth で変えた「カーソルの速さ」の倍率を掛ける（linea_settings）。
      ビルドせずに速さを変えるため。0 なら掛けない
  precision-layer:
    type: int
    default: -1
    description: このレイヤーがいちばん上のとき、移動量を 1/precision-divisor にする（精密モード）。-1 なら使わない
  precision-divisor:
    type: int
    default: 1
    description: 精密モードの割合（LiNEA40 Studio から変えた値があればそちら）
  enable-default:
    type: int
    default: 1
    description: 0 なら、LiNEA40 Studio でオンにするまで倍率を掛けない（settings-slot 3 のスクロールの加速）
