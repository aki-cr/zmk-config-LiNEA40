description: |
  LiNEA40 用のスクロールの刻み。ホイールの信号を1回あたり ±1 段にそろえ（エンコーダーと同じ形）、
  あふれた分は max-carry 段まで持ち越して次の報告で送る。

compatible: "linea,input-processor-tick"

include: ip_zero_param.yaml

properties:
  max-carry:
    type: int
    default: 3
    description: 持ち越す段数の上限
  enable-default:
    type: int
    default: 1
    description: 0 なら、LiNEA40 Studio でオンにするまで何もしない（まとめて送る）
  pace-default:
    type: int
    default: 0
    description: |
      1 にすると、届いた段を貯めて平均の間隔で1段ずつ送り出す（転がし直しのすき間でスクロールが止まらないように）。
      LiNEA40 Studio から切り替えられる。送り出した信号は、この部品を device にした input-listener が Mac に送る
  pace-buffer:
    type: int
    default: 12
    description: すき間を埋めるときに貯める段の上限（指を離したあと流れ続けすぎないように）
