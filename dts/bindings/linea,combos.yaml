description: |
  LiNEA40 用のコンボの入れ物（ZMK の zmk,combos と同じ書き方）。
  ここに書いたコンボは、LiNEA40 Studio で変えていないときの値（src/linea_combo.c が読む）

compatible: "linea,combos"

child-binding:
  description: "A combo"

  properties:
    bindings:
      type: phandle-array
      required: true
    key-positions:
      type: array
      required: true
    timeout-ms:
      type: int
      default: 50
    require-prior-idle-ms:
      type: int
      default: -1
    slow-release:
      type: boolean
    layers:
      type: array
      default: [-1]
